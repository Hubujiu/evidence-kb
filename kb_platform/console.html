<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文档证据工作台</title>
<link rel="icon" href="data:,">
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#24323b;background:#f2f4f2}*{box-sizing:border-box}body{margin:0}header{padding:22px 32px;background:#163b38;color:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}header p{margin:2px 0;color:#bfd7ce}main{max-width:1480px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:270px 1fr 1fr;gap:20px}section,aside{background:#fff;border:1px solid #d8e1db;border-radius:10px;padding:22px;align-self:start;min-width:0}h2{font-size:17px;margin:0 0 16px}h3{font-size:15px}label{display:block;margin:12px 0 5px;font-size:13px;color:#52615c}input,select,button{font:inherit;max-width:100%}input,select{padding:9px;border:1px solid #bccac1;border-radius:5px;width:100%}button{padding:9px 14px;border:0;border-radius:5px;background:#22695a;color:#fff;cursor:pointer;margin:10px 5px 0 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e9efea;color:#294a40}.muted{font-size:12px;color:#66766c;overflow-wrap:anywhere}.status{white-space:pre-wrap;color:#355c48;margin-top:18px}.hit{padding:14px 0;border-bottom:1px solid #e1e6e2}.hit p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f3;padding:14px;font:13px/1.7 ui-monospace,monospace;max-height:420px;overflow:auto}mark{background:#fff1a9;padding:2px}img{max-width:100%;border:1px solid #d8e1db}#message{margin:0 24px 20px;white-space:pre-wrap;font-size:13px;color:#884431}.badge{border:1px solid #6f998d;border-radius:30px;padding:3px 12px;font-size:12px}#empty{color:#7a877f;padding:40px 10px;text-align:center}@media(max-width:1000px){main{grid-template-columns:240px 1fr}#viewer{grid-column:1/-1}}@media(max-width:650px){main{display:block;padding:0 12px}section,aside{margin-bottom:14px}header{padding:20px}header .badge{display:none}}
</style>
<style>header nav a{color:#fff;margin-left:18px;white-space:nowrap}</style>
<header><div><h1>文档证据工作台</h1><p>原件、证据与检索，同属一个知识库。</p></div><nav><span class="badge">本地工程验收版 · v0.1</span><a href="/agent">知识库对话</a></nav></header>
<main>
<aside><h2>范围与身份</h2><label for="token">本地访问令牌</label><input id="token" type="password" autocomplete="off" placeholder="使用当前服务配置的访问令牌"><button id="connect">连接</button><p id="identity" class="muted">尚未连接。</p><label for="kb">当前知识库</label><select id="kb"><option value="">请先连接</option></select><label for="name">新知识库名称</label><input id="name" placeholder="例如 运维手册"><button id="create" class="secondary">新建知识库</button><hr><p class="muted">切换知识库会清空当前结果与原文预览。来源阅读权限独立于知识库成员权限。</p><p class="muted">此版本已接入原生文件解析与 BM25。工程夹具通过不代表真实业务或生产准入通过。</p></aside>
<section><h2>入库与检索</h2><label for="file">添加文件</label><input id="file" type="file" accept=".pdf,.docx,.pptx,.xlsx,.csv,.md,.txt,.html,.png,.jpg,.jpeg"><button id="upload">上传并解析</button><button id="publish" class="secondary">构建并发布索引</button><p id="ingest" class="muted">原件保留。解析结果会明确报告缺失内容。</p><hr><label for="query">检索问题或关键词</label><input id="query" placeholder="例如 升级前的备份步骤"><label for="channel">检索方式</label><select id="channel"><option value="bm25">关键词 BM25</option><option value="structure">章节与流程扩展</option></select><button id="search">在当前库检索</button><div id="results"><p id="empty">发布文件后，在这里查看可追溯的证据。</p></div></section>
<section id="viewer"><h2>来源与定位</h2><p class="muted">选择一条检索结果，核对原件版本与定位。每次打开都会重新验证权限。</p><div id="citation"></div></section>
</main><p id="message" role="status" aria-live="polite"></p>
<script>
const $=id=>document.getElementById(id);let currentBlob=null,viewRevision=0;
function clearView(){viewRevision++;$('results').replaceChildren();$('citation').replaceChildren();if(currentBlob){URL.revokeObjectURL(currentBlob);currentBlob=null;} }
function message(text){$('message').textContent=text;}
async function request(path,options={}){const revision=viewRevision,kb=$('kb').value,token=$('token').value;const headers={Authorization:'Bearer '+token,...options.headers};if(options.body&&!(options.body instanceof FormData))headers['Content-Type']='application/json';const response=await fetch(path,{...options,headers});if(revision!==viewRevision||kb!==$('kb').value||token!==$('token').value)throw new Error('范围已切换，已丢弃之前的响应。');if(!response.ok){let detail;try{detail=await response.json()}catch{detail={detail:'请求未完成'}}throw new Error(response.status+' '+(detail.detail||detail.error||'请求失败'));}return response;}
function currentScope(){return JSON.stringify([viewRevision,$('kb').value,$('token').value]);}
async function json(path,options={}){const stamp=currentScope();const response=await request(path,options);const result=await response.json();if(stamp!==currentScope())throw new Error('范围已切换，已丢弃之前的响应。');return result;}
async function blob(path){const stamp=currentScope();const response=await request(path);const result=await response.blob();if(stamp!==currentScope())throw new Error('范围已切换，已丢弃之前的响应。');return result;}
function scope(){const id=$('kb').value;if(!id)throw new Error('请先选择知识库。');return'/knowledge-bases/'+encodeURIComponent(id);}
async function refresh(selected){const items=await json('/knowledge-bases');$('kb').replaceChildren();for(const item of items){const option=document.createElement('option');option.value=item.kb_id;option.textContent=item.name;$('kb').append(option);}if(selected)$('kb').value=selected;}
async function action(button,fn){button.disabled=true;message('');try{await fn();}catch(error){message(error.message);}finally{button.disabled=false;}}
$('connect').onclick=()=>action($('connect'),async()=>{clearView();const id=await json('/identity');$('identity').textContent=id.tenant_id+' / '+id.principal_id;await refresh();message('身份已验证。');});
$('create').onclick=()=>action($('create'),async()=>{const kb=await json('/knowledge-bases',{method:'POST',body:JSON.stringify({name:$('name').value})});await refresh(kb.kb_id);clearView();message('已创建知识库。');});
$('kb').onchange=()=>{clearView();$('ingest').textContent='已切换知识库，当前视图已清空。';};
$('token').oninput=()=>{clearView();$('identity').textContent='身份已更改，请重新连接。';$('kb').replaceChildren();};
$('upload').onclick=()=>action($('upload'),async()=>{const file=$('file').files[0];if(!file)throw new Error('请选择文件。');const data=new FormData();data.append('file',file);const result=await json(scope()+'/sources',{method:'POST',body:data});$('ingest').textContent=file.name+' · '+result.document.status+' · '+result.document.elements.length+' 个结构元素';message('文件已解析。构建并发布后可检索。');});
$('publish').onclick=()=>action($('publish'),async()=>{const prefix=scope();const build=await json(prefix+'/builds',{method:'POST'});const manifest=await json(prefix+'/builds/'+build.build_id+'/publish',{method:'POST'});message('索引已发布。版本 '+manifest.manifest_id);});
async function showCitation(id){const prefix=scope();const data=await json(prefix+'/citations/'+id);const container=$('citation');container.replaceChildren();const title=document.createElement('h3');title.textContent=data.filename;container.append(title);const version=document.createElement('p');version.className='muted';version.textContent='原件版本 '+data.source_version_id;container.append(version);const excerpt=document.createElement('pre');const mark=document.createElement('mark');mark.textContent=data.text;excerpt.append(mark);container.append(excerpt);const location=document.createElement('pre');location.textContent=JSON.stringify(data.anchors,null,2);container.append(location);if(data.media_type==='application/pdf'){const preview=await blob(prefix+'/citations/'+id+'/preview');if(currentBlob)URL.revokeObjectURL(currentBlob);currentBlob=URL.createObjectURL(preview);const image=document.createElement('img');image.src=currentBlob;image.alt='PDF 原页面与证据高亮';container.prepend(image);}const download=document.createElement('button');download.textContent='下载原件';download.className='secondary';download.onclick=()=>action(download,async()=>{const original=await blob(prefix+'/citations/'+id+'/original');const url=URL.createObjectURL(original);const link=document.createElement('a');link.href=url;link.download=data.filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});container.append(download);}
$('search').onclick=()=>action($('search'),async()=>{clearView();const data=await json(scope()+'/search',{method:'POST',body:JSON.stringify({query:$('query').value,channel:$('channel').value})});for(const hit of data.hits){const block=document.createElement('div');block.className='hit';const text=document.createElement('p');text.textContent=hit.text;const button=document.createElement('button');button.className='secondary';button.textContent='查看原文与定位';button.onclick=()=>action(button,()=>showCitation(hit.citation_id));block.append(text,button);$('results').append(block);}if(!data.hits.length){const empty=document.createElement('p');empty.textContent='当前授权范围内未找到匹配证据。';$('results').append(empty);}message('当前库返回 '+data.hits.length+' 条证据。');});
$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click();};
</script></html>
