<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文档证据工作台</title>
<link rel="icon" href="data:,">
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#24323b;background:#f2f4f2}*{box-sizing:border-box}body{margin:0}header{padding:22px 32px;background:#163b38;color:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}header p{margin:2px 0;color:#bfd7ce}main{max-width:1480px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:270px 1fr 1fr;gap:20px}section,aside{background:#fff;border:1px solid #d8e1db;border-radius:10px;padding:22px;align-self:start;min-width:0}h2{font-size:17px;margin:0 0 16px}h3{font-size:15px}label{display:block;margin:12px 0 5px;font-size:13px;color:#52615c}input,select,button{font:inherit;max-width:100%}input,select{padding:9px;border:1px solid #bccac1;border-radius:5px;width:100%}button{padding:9px 14px;border:0;border-radius:5px;background:#22695a;color:#fff;cursor:pointer;margin:10px 5px 0 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e9efea;color:#294a40}.muted{font-size:12px;color:#66766c;overflow-wrap:anywhere}.status{white-space:pre-wrap;color:#355c48;margin-top:18px}.hit{padding:14px 0;border-bottom:1px solid #e1e6e2}.hit p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f3;padding:14px;font:13px/1.7 ui-monospace,monospace;max-height:420px;overflow:auto}mark{background:#fff1a9;padding:2px}img{max-width:100%;border:1px solid #d8e1db}#message{margin:0 24px 20px;white-space:pre-wrap;font-size:13px;color:#884431}.badge{border:1px solid #6f998d;border-radius:30px;padding:3px 12px;font-size:12px}#empty{color:#7a877f;padding:40px 10px;text-align:center}@media(max-width:1000px){main{grid-template-columns:240px 1fr}#viewer{grid-column:1/-1}}@media(max-width:650px){main{display:block;padding:0 12px}section,aside{margin-bottom:14px}header{padding:20px}header .badge{display:none}}
</style>
<style>header nav a{color:#fff;margin-left:18px;white-space:nowrap}</style>
<header><div><h1>文档证据工作台</h1><p>原件、证据与检索，同属一个知识库。</p></div><nav><span class="badge">本地工程验收版 · v0.1</span><a href="/agent">知识库对话</a></nav></header>
<main>
<aside><h2>范围与身份</h2><label for="token">本地访问令牌</label><input id="token" type="password" autocomplete="off" placeholder="使用当前服务配置的访问令牌"><button id="connect">连接</button><p id="identity" class="muted">尚未连接。</p><label for="kb">当前知识库</label><select id="kb"><option value="">请先连接</option></select><label for="name">新知识库名称</label><input id="name" placeholder="例如 运维手册"><button id="create" class="secondary">新建知识库</button><hr><p class="muted">切换知识库会清空当前结果与原文预览。来源阅读权限独立于知识库成员权限。</p><p class="muted">此版本已接入原生文件解析与 BM25。工程夹具通过不代表真实业务或生产准入通过。</p></aside>
<section><h2>入库与检索</h2><label for="file">添加文件</label><input id="file" type="file" accept=".pdf,.docx,.pptx,.xlsx,.csv,.md,.txt,.html,.png,.jpg,.jpeg"><button id="upload">上传并解析</button><button id="publish" class="secondary">构建并发布索引</button><p id="ingest" class="muted">原件保留。解析结果会明确报告缺失内容。</p><hr><label for="query">检索问题或关键词</label><input id="query" placeholder="例如 升级前的备份步骤"><label for="channel">检索方式</label><select id="channel"><option value="bm25">关键词 BM25</option><option value="structure">章节与流程扩展</option></select><button id="search">在当前库检索</button><div id="results"><p id="empty">发布文件后，在这里查看可追溯的证据。</p></div></section>
<section id="viewer"><h2>来源与定位</h2><p class="muted">选择一条检索结果，核对原件版本与定位。每次打开都会重新验证权限。</p><div id="citation"></div></section>
</main><p id="message" role="status" aria-live="polite"></p>
<script type="module" src="/console.mjs"></script></html>
