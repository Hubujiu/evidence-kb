<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>知识库对话 · 证据助手</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17302b;background:#f3f6f3;font-size:15px}*{box-sizing:border-box}
body{margin:0}header{background:#123f35;color:white;padding:22px 30px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#c6ded5}a{color:#176951}header a{color:white}
main{display:grid;grid-template-columns:300px minmax(380px,1fr);max-width:1350px;margin:auto;gap:22px;padding:24px}
aside,article{background:white;border:1px solid #dbe5df;border-radius:12px;padding:20px}aside{align-self:start}label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea,button{font:inherit;border-radius:6px;border:1px solid #aebfb6;padding:9px;width:100%;background:white;color:inherit}
select[multiple]{min-height:130px}textarea{resize:vertical}button{background:#176951;color:white;border:0;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5;cursor:wait}.secondary{background:#e5eee8;color:#17302b}small,.muted{color:#5b7167;line-height:1.5}.message{padding:16px 0;border-bottom:1px solid #e2e9e4}
.message .role{font-weight:700;margin-bottom:7px}.message pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin:0}.user .role{color:#6e627d}
.pill{font-size:12px;border-radius:20px;background:#e6f0e8;padding:3px 8px;display:inline-block;margin:3px}.error{color:#ae3026}.citations{margin-top:12px;padding:10px;background:#f6f8f5;border-radius:6px}
.statements{margin-top:12px;padding:10px;background:#f1f4fa;border-left:3px solid #7185a2;border-radius:6px}.statements .muted{margin-top:8px}
details{margin-top:12px}summary{cursor:pointer}.trace{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
#status{min-height:26px;padding:7px 0}#transcript{min-height:210px}#empty{padding:24px 8px}.compose{margin-top:20px}.row{display:flex;gap:8px}.row>*{flex:1}
@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}aside{order:2}}
</style></head><body><header><div><h1>知识库对话 · 证据助手</h1><p>追问、阅读原文、计算与核验，在同一段对话中完成。</p></div><a href="/">管理文档</a></header>
<main><aside><label for="token">访问令牌</label><input id="token" type="password" autocomplete="off" placeholder="输入本地访问令牌">
<button id="connect" class="secondary">连接知识库</button><label for="scope">知识库</label><select id="scope"><option value="">请先连接</option></select>
<input id="profile" type="hidden" value="recommended">
<label for="mode">来源范围</label><select id="mode"><option value="AUTO">自动选择允许的来源</option><option value="PREFER">优先使用所选来源</option><option value="LOCKED">仅使用所选来源</option></select>
<label for="sources">选择来源</label><select id="sources" multiple aria-describedby="sourceHint"></select><small id="sourceHint">按住 Ctrl 可多选。锁定来源时，助手只使用这些文档回答文档事实。</small>
<div class="row"><div><label for="version">文档版本</label><select id="version"><option value="latest">最新发布版本</option><option value="pinned">固定阅读版本</option></select></div><div><label for="lifetime">生效范围</label><select id="lifetime"><option value="session">整个会话</option><option value="turn">仅这一轮</option><option value="topic">当前话题</option></select></div></div>
<label for="constraints">必须遵守的要求</label><textarea id="constraints" rows="3" placeholder="每行一条，例如：金额保留两位小数"></textarea>
<details><summary>流程进度与已确认条件</summary><label for="workflowStep">当前流程步骤</label><input id="workflowStep" placeholder="填写流程原文中的步骤名称"><label for="workflowFacts">已确认条件</label><textarea id="workflowFacts" rows="3" placeholder="每行一个条件，例如：licensed=yes"></textarea><small>这些信息由你确认。助手会依据流程原文判断下一步，缺少条件时要求补充。</small></details>
<button id="new">新建会话</button><label for="savedSessions">我的会话</label><select id="savedSessions"><option value="">连接后查看最近会话</option></select><button id="refreshSessions" class="secondary">刷新我的会话</button>
<label for="sessionId">恢复会话</label><input id="sessionId" placeholder="从上方选择，或粘贴会话 ID"><button id="restore" class="secondary">加载历史</button><button id="exportSession" class="secondary">导出可访问的对话 JSON</button>
<details><summary>服务状态与用量</summary><p id="runtimeStatus" class="muted">连接后查看预算。依赖状态尚未检查。</p><button id="refreshRuntime" class="secondary">检查服务状态（不调用模型）</button></details>
<p class="muted" id="capabilities"></p></aside>
<article><div id="status" role="status" aria-live="polite">正在连接…</div><div id="transcript"><p id="empty" class="muted">选择知识库并提问。来源和引用会随答案一起显示；历史保存在服务端。</p></div>
<div class="compose"><label for="question">你的问题</label><textarea id="question" rows="4" placeholder="例如：这份文档中的限制是什么？再解释刚才第二条。"></textarea><button id="send">发送</button></div></article></main>
<script type="module" src="/agent_console.mjs"></script></body></html>
