<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>知识库对话 · 证据助手</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17302b;background:#f3f6f3;font-size:15px}*{box-sizing:border-box}
body{margin:0}header{background:#123f35;color:white;padding:22px 30px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#c6ded5}a{color:#176951}header a{color:white}
main{display:grid;grid-template-columns:300px minmax(380px,1fr);max-width:1350px;margin:auto;gap:22px;padding:24px}
aside,article{background:white;border:1px solid #dbe5df;border-radius:12px;padding:20px}aside{align-self:start}label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea,button{font:inherit;border-radius:6px;border:1px solid #aebfb6;padding:9px;width:100%;background:white;color:inherit}
select[multiple]{min-height:130px}textarea{resize:vertical}button{background:#176951;color:white;border:0;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5;cursor:wait}.secondary{background:#e5eee8;color:#17302b}small,.muted{color:#5b7167;line-height:1.5}.message{padding:16px 0;border-bottom:1px solid #e2e9e4}
.message .role{font-weight:700;margin-bottom:7px}.message pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin:0}.user .role{color:#6e627d}
.pill{font-size:12px;border-radius:20px;background:#e6f0e8;padding:3px 8px;display:inline-block;margin:3px}.error{color:#ae3026}.citations{margin-top:12px;padding:10px;background:#f6f8f5;border-radius:6px}
.statements{margin-top:12px;padding:10px;background:#f1f4fa;border-left:3px solid #7185a2;border-radius:6px}.statements .muted{margin-top:8px}
details{margin-top:12px}summary{cursor:pointer}.trace{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
#status{min-height:26px;padding:7px 0}#transcript{min-height:210px}#empty{padding:24px 8px}.compose{margin-top:20px}.row{display:flex;gap:8px}.row>*{flex:1}
@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}aside{order:2}}
</style></head><body><header><div><h1>知识库对话 · 证据助手</h1><p>追问、阅读原文、计算与核验，在同一段对话中完成。</p></div><a href="/">管理文档</a></header>
<main><aside><label for="token">访问令牌</label><input id="token" type="password" autocomplete="off" placeholder="输入本地访问令牌">
<button id="connect" class="secondary">连接知识库</button><label for="scope">知识库</label><select id="scope"><option value="">请先连接</option></select>
<input id="profile" type="hidden" value="recommended">
<label for="mode">来源范围</label><select id="mode"><option value="AUTO">自动选择允许的来源</option><option value="PREFER">优先使用所选来源</option><option value="LOCKED">仅使用所选来源</option></select>
<label for="sources">选择来源</label><select id="sources" multiple aria-describedby="sourceHint"></select><small id="sourceHint">按住 Ctrl 可多选。锁定来源时，助手只使用这些文档回答文档事实。</small>
<div class="row"><div><label for="version">文档版本</label><select id="version"><option value="latest">最新发布版本</option><option value="pinned">固定阅读版本</option></select></div><div><label for="lifetime">生效范围</label><select id="lifetime"><option value="session">整个会话</option><option value="turn">仅这一轮</option><option value="topic">当前话题</option></select></div></div>
<label for="constraints">必须遵守的要求</label><textarea id="constraints" rows="3" placeholder="每行一条，例如：金额保留两位小数"></textarea>
<details><summary>流程进度与已确认条件</summary><label for="workflowStep">当前流程步骤</label><input id="workflowStep" placeholder="填写流程原文中的步骤名称"><label for="workflowFacts">已确认条件</label><textarea id="workflowFacts" rows="3" placeholder="每行一个条件，例如：licensed=yes"></textarea><small>这些信息由你确认。助手会依据流程原文判断下一步，缺少条件时要求补充。</small></details>
<button id="new">新建会话</button><label for="savedSessions">我的会话</label><select id="savedSessions"><option value="">连接后查看最近会话</option></select><button id="refreshSessions" class="secondary">刷新我的会话</button>
<label for="sessionId">恢复会话</label><input id="sessionId" placeholder="从上方选择，或粘贴会话 ID"><button id="restore" class="secondary">加载历史</button><button id="exportSession" class="secondary">导出可访问的对话 JSON</button>
<details><summary>服务状态与用量</summary><p id="runtimeStatus" class="muted">连接后查看预算。依赖状态尚未检查。</p><button id="refreshRuntime" class="secondary">检查服务状态（不调用模型）</button></details>
<p class="muted" id="capabilities"></p></aside>
<article><div id="status" role="status" aria-live="polite">正在连接…</div><div id="transcript"><p id="empty" class="muted">选择知识库并提问。来源和引用会随答案一起显示；历史保存在服务端。</p></div>
<div class="compose"><label for="question">你的问题</label><textarea id="question" rows="4" placeholder="例如：这份文档中的限制是什么？再解释刚才第二条。"></textarea><button id="send">发送</button></div></article></main>
<script>
const $=id=>document.getElementById(id);let session=null,sending=false,sourceRows=[],uiRevision=0;
const stateKey=()=>JSON.stringify([uiRevision,$('token').value]);
function current(before){if(before!==stateKey()){const error=Error('连接已切换，旧响应已丢弃。');error.stale=true;throw error;}}
async function api(path,body,allowUnavailable=false){const before=stateKey();const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;
if(body!==undefined)headers['Content-Type']='application/json';const r=await fetch(path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body)});
const d=await r.json();current(before);if(!r.ok&&!(allowUnavailable&&r.status===503))throw Error(d.error?.message||d.error?.code||d.message||d.detail||(typeof d.error==='string'?d.error:null)||r.status);return d;}
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
function showError(error){if(!error.stale)status(error.message,true);}
async function work(action){if(sending)return;sending=true;document.querySelectorAll('button,select,aside input,aside textarea').forEach(x=>x.disabled=true);try{await action();}catch(error){showError(error);}finally{sending=false;document.querySelectorAll('button,select,aside input,aside textarea').forEach(x=>x.disabled=false);}}
function resetScope(){uiRevision++;session=null;sourceRows=[];$('sessionId').value='';$('transcript').replaceChildren();$('sources').replaceChildren();$('question').value='';$('constraints').value='';$('workflowStep').value='';$('workflowFacts').value='';$('mode').value='AUTO';$('version').value='latest';$('lifetime').value='session';}
function clearAccountPanels(){$('savedSessions').replaceChildren();$('runtimeStatus').textContent='请先连接当前身份，再查看服务状态。';}
function responseText(response){if(response.answer)return response.answer;const code=response.stop_reason||'';if(code==='CONTEXT_UNFIT')return '当前会话内容已超出本方案的上下文预算。请缩短本轮内容，或新建会话后继续；已有记录仍保留。';if(code==='CONTEXT_REQUIRED_STATE_TOO_LARGE')return '本轮问题与必须保留的信息超过上下文预算。请缩短本轮内容，或新建会话后继续；已有记录仍保留。';if(code==='RAG_PHYSICAL_REQUEST_ADMISSION_FAILED')return '服务预算或请求状态阻断，请检查服务状态与用量。新建会话不会重置服务额度；结果不明的请求不要重复提交。';if(code.includes('BUDGET')||code.includes('TOKEN_LIMIT')||code.includes('OUTPUT_LIMIT'))return '本轮已达到执行或用量限制。请缩短本轮内容，或新建会话后继续；已有记录仍保留。若仍无法继续，请检查服务的用量限制。';return '本轮未完成，执行记录已保留。请查看本轮步骤与用量。';}
function capabilitiesText(cap){const compact=cap.configurations?.[cap.recommended]?.compact;return '上下文用量采用估算，完整历史保留。'+(compact===true?'当前推荐方案会在超出预算时压缩模型可见历史。':compact===false?'当前推荐方案不压缩历史；超过预算时会停止本轮。':'当前推荐方案的历史压缩策略未确认。');}
function policy(){const ids=[...$('sources').selectedOptions].map(x=>x.value);if($('mode').value==='LOCKED'&&!ids.length)throw Error('请先选择要锁定的来源');
return{mode:$('mode').value,source_ids:ids,versions:{},version_policy:$('version').value,lifetime:$('lifetime').value};}
function workflowState(){const current_step=$('workflowStep').value.trim(),facts={};for(const line of $('workflowFacts').value.split('\n').map(x=>x.trim()).filter(Boolean)){const index=line.indexOf('=');if(index<1||!line.slice(index+1).trim())throw Error('流程条件请按“条件名=已确认值”逐行填写。');const key=line.slice(0,index).trim();if(Object.hasOwn(facts,key))throw Error('流程条件名重复：'+key);Object.defineProperty(facts,key,{value:line.slice(index+1).trim(),enumerable:true});}return current_step||Object.keys(facts).length?{current_step,facts}:undefined;}
function display(role,text,response){$('empty')?.remove();const card=document.createElement('section');card.className='message '+(role==='你'?'user':'assistant');
const title=document.createElement('div');title.className='role';title.textContent=role;card.append(title);const content=document.createElement('pre');content.textContent=text;card.append(content);
if(response){const info=document.createElement('div');info.className='muted';const labels={answered:'已回答',partial:'部分回答，仍有待确认事项',abstained:'暂无法可靠回答',clarification:'需要补充信息',error:'执行失败',redacted:'来源已不可访问'};const elapsed=response.trace?.elapsed_seconds;info.textContent=(labels[response.status]||'本轮已结束')+(Number.isFinite(elapsed)?` · ${elapsed.toFixed(2)} 秒`:'');card.append(info);if(response.unresolved?.length){const pending=document.createElement('p');pending.className='muted';pending.textContent='待确认：'+response.unresolved.join('；');card.append(pending);}
const used=new Set((response.claims||[]).flatMap(c=>c.evidence_ids||[]));const evidence=(response.evidence||[]).filter(e=>used.has(e.evidence_id));
for(const e of evidence){const cite=document.createElement('div');cite.className='citations';const label=document.createElement('div');const source=sourceRows.find(row=>row.source_id===e.source_id);label.textContent=(e.title||source?.title||e.filename||e.doc_id||e.source_id)+' · '+String(e.source_version_id||'').slice(0,12);cite.append(label);
const quotes=(response.claims||[]).flatMap(c=>c.quotes||[]).filter(q=>q.evidence_id===e.evidence_id).map(q=>q.quote);const quote=document.createElement('p');quote.textContent=[...new Set(quotes)].join('\n');cite.append(quote);
const citationScope=session?.scope_id;const link=document.createElement('button');link.className='secondary';link.textContent='查看原文定位';link.onclick=async()=>{const before=stateKey();try{const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;const r=await fetch(`/knowledge-bases/${encodeURIComponent(citationScope)}/citations/${encodeURIComponent(e.citation_id)}/preview`,{headers});current(before);if(!r.ok)throw Error('原文当前不可访问');const b=await r.blob();current(before);const u=URL.createObjectURL(b);window.open(u,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(u),60000);}catch(err){showError(err)}};cite.append(link);card.append(cite);}
if(response.user_statements?.length){const statements=document.createElement('div');statements.className='statements';const heading=document.createElement('strong');heading.textContent='你在会话中的陈述';statements.append(heading);for(const item of response.user_statements){const event=document.createElement('div');event.className='muted';event.textContent='事件 #'+item.event_seq;const quote=document.createElement('pre');quote.textContent=item.quote;statements.append(event,quote);}card.append(statements);}
const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看本轮步骤与用量';details.append(summary);const trace=document.createElement('pre');trace.className='trace';trace.textContent=JSON.stringify({...response.trace,stop_reason:response.stop_reason},null,2);details.append(trace);card.append(details);}
$('transcript').append(card);card.scrollIntoView({block:'nearest'});}
async function sources(){sourceRows=await api(`/scopes/${encodeURIComponent($('scope').value)}/agent-sources`);$('sources').replaceChildren();for(const row of sourceRows){const o=document.createElement('option');o.value=row.source_id;o.textContent=row.title||row.doc_id||row.source_id;$('sources').append(o);}}
async function loadSessions(){const page=await api('/agent/sessions?limit=50');$('savedSessions').replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='选择最近会话（最多50条）';$('savedSessions').append(empty);for(const item of page.sessions){const option=document.createElement('option');option.value=item.session_id;const scope=[...$('scope').options].find(x=>x.value===item.scope_id);option.textContent=(scope?.textContent||'知识库')+' · '+item.updated_at+' · 第'+item.revision+'轮';$('savedSessions').append(option);}}
async function runtimeStatus(checkDependencies=false){
const value=await api('/agent/runtime-status');if(!value.configured){$('runtimeStatus').textContent='当前服务未配置交付预算状态。';return;}
const remaining=value.remaining||{};let text='本批次剩余：模型 '+(remaining.model??'未知')+' 次，向量 '+(remaining.remote_embedding_calls??'未知')+' 次。'+(value.pending_or_unknown?'有未决请求，后续调用已阻断，请核对原请求，不要重复发送。':value.provider_blocked?'模型或向量通道因权限错误已阻断，需要维护者确认外部认证修复后显式解除；新建会话或重启不会自动试探。':value.status==='BUDGET_EXHAUSTED'?'本批次模型额度已用尽，需要维护者登记新的有界批次；新建会话不会重置额度。':value.status==='BLOCKED'?'预算或父账本状态阻断，请检查服务记录。':'历史费用与未知用量预留均保留。');
const cumulative=value.cumulative_effective_usage_or_reserved;text+=cumulative?' 累计已用或预留：模型 '+cumulative.model+' 次、向量 '+cumulative.remote_embedding_calls+' 次。':' 历史账本暂不可完整核验。';
if(checkDependencies){const readiness=await api('/agent/readiness',undefined,true);text+=' 依赖：'+(readiness.ready?'已就绪。':'尚未就绪。')+Object.entries(readiness.dependencies||{}).map(([name,item])=>name+' '+(item.ready?'正常':'不可用')).join('；');}else{text+=' 依赖状态尚未检查。';}$('runtimeStatus').textContent=text;}
async function connect(){return work(async()=>{resetScope();clearAccountPanels();$('scope').replaceChildren();$('capabilities').textContent='';status('正在连接…');const [scopes,cap]=await Promise.all([api('/scopes'),api('/agent/capabilities')]);for(const x of scopes){const o=document.createElement('option');o.value=x.scope_id;o.textContent=x.name;$('scope').append(o);}
$('capabilities').textContent=capabilitiesText(cap);if(scopes.length)await sources();await loadSessions();await runtimeStatus();status(scopes.length?'已连接，可直接提问。':'请先到文档管理创建知识库。');});}
async function create(){if(!$('scope').value)throw Error('请选择知识库');const created=await api(`/scopes/${encodeURIComponent($('scope').value)}/sessions`,{source_policy:policy(),config_name:$('profile').value});uiRevision++;session=created;$('sessionId').value=session.session_id;$('transcript').replaceChildren();await loadSessions();status('新会话已创建');}
$('savedSessions').onchange=()=>{$('sessionId').value=$('savedSessions').value;};$('refreshSessions').onclick=()=>work(loadSessions);$('refreshRuntime').onclick=()=>work(()=>runtimeStatus(true));
$('exportSession').onclick=()=>work(async()=>{const id=session?.session_id||$('sessionId').value.trim();if(!id)throw Error('请先选择或加载一个会话');const value=await api('/agent/sessions/'+encodeURIComponent(id)+'/export');const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='session-'+id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('已导出当前有权查看的对话；不可访问的来源已隐藏。');});
$('connect').onclick=connect;$('token').oninput=()=>{resetScope();clearAccountPanels();$('scope').replaceChildren();$('capabilities').textContent='';status('访问令牌已更改，请重新连接知识库。');};$('scope').onchange=()=>work(async()=>{resetScope();await sources();status('已切换知识库，下次提问将建立新会话。');});$('new').onclick=()=>work(create);
$('restore').onclick=()=>work(async()=>{const id=$('sessionId').value.trim();if(!id)throw Error('请输入要恢复的会话 ID');resetScope();const restored=await api('/agent/sessions/'+encodeURIComponent(id));$('scope').value=restored.scope_id;await sources();const history=await api('/agent/sessions/'+encodeURIComponent(id)+'/history');session=restored;$('sessionId').value=session.session_id;const p=session.state.source_policy;$('mode').value=p.mode;$('version').value=p.version_policy;$('lifetime').value=p.lifetime;for(const option of $('sources').options)option.selected=p.source_ids.includes(option.value);
$('profile').value='recommended';$('constraints').value=(session.state.constraints||[]).map(x=>x.text).join('\n');$('workflowStep').value=session.state.workflow_state?.current_step||'';$('workflowFacts').value=Object.entries(session.state.workflow_state?.facts||{}).map(([key,value])=>key+'='+value).join('\n');for(const e of history.events){if(e.kind==='user')display('你',e.payload.text);else display('助手',e.payload.status==='redacted'?'此历史答案的来源已不可访问。':responseText(e.payload),e.payload.status==='redacted'?null:e.payload);}status(session.state.config_name==='evidence_release_candidate'?'会话已恢复':'该历史方案已停用，可查看或导出；继续提问请新建会话。');});
$('send').onclick=()=>work(async()=>{const message=$('question').value.trim();if(!message)return;if(!session)await create();if(session.state.config_name!=='evidence_release_candidate')throw Error('该历史方案已停用，请新建标准会话后继续提问。');display('你',message);status('正在分析问题并检查证据…');const p=policy();if(p.version_policy==='pinned'&&JSON.stringify(p.source_ids)===JSON.stringify(session.state.source_policy.source_ids))p.versions=session.state.source_policy.versions;
const result=await api('/agent/sessions/'+session.session_id+'/turns',{message,request_id:crypto.randomUUID(),expected_revision:session.revision,source_policy:p,constraints:$('constraints').value.split('\n').map(x=>x.trim()).filter(Boolean),workflow_state:workflowState()});session=await api('/agent/sessions/'+session.session_id);display('助手',responseText(result),result);$('question').value='';if(p.lifetime==='turn'){$('mode').value='AUTO';$('version').value='latest';$('lifetime').value='session';for(const option of $('sources').options)option.selected=false;}status(result.status==='error'?'本轮执行失败，记录已保留。':'本轮已结束，可以继续追问。',result.status==='error');});
connect();
</script></body></html>
