name: evidence-kb-v01
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: kb_admin
      POSTGRES_PASSWORD: kb_local_admin
      POSTGRES_DB: evidence_kb
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - metadata:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_admin -d evidence_kb"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
  search:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:59200:9200"
    volumes:
      - search:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 40
    mem_limit: 3g
volumes:
  metadata:
  search:
