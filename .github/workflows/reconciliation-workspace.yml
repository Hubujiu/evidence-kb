name: Reconciliation workspace

on:
  push:
    branches: [codex/pr-reconciliation-workbench-20261109]
    paths: [.github/workflows/reconciliation-workspace.yml]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public repository history and current PR identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pull/*'
          mkdir -p /tmp/reconciliation-workspace
          git bundle create /tmp/reconciliation-workspace/repository.bundle --all
          gh api --paginate 'repos/Hubujiu/evidence-kb/pulls?state=open&per_page=100' --jq '.[] | {number,title,draft,base:.base.ref,base_sha:.base.sha,head:.head.ref,head_sha:.head.sha,body}' > /tmp/reconciliation-workspace/open-prs.jsonl
          git show-ref > /tmp/reconciliation-workspace/refs.txt
          sha256sum /tmp/reconciliation-workspace/repository.bundle > /tmp/reconciliation-workspace/bundle.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reconciliation-workspace
          path: /tmp/reconciliation-workspace/
          retention-days: 3
          if-no-files-found: error
