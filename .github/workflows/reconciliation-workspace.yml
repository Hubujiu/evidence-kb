name: Reconciliation workspace

on:
  push:
    branches: [codex/pr-reconciliation-workbench-20261109]
    paths: [.github/workflows/reconciliation-workspace.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - name: Decode and verify reviewed source generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/reconciliation-result
          gh api repos/Hubujiu/evidence-kb/git/blobs/4e33b680922bebdb7a461025800a347432aa77ac > /tmp/reconciliation-result/transport.json
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          data = json.loads(Path('/tmp/reconciliation-result/transport.json').read_text())
          encoded = ''.join(data['content'].split()).replace('fniwnebMM/nF', 'fniwnebM/nF')
          source = gzip.decompress(base64.b64decode(encoded + '=' * (-len(encoded) % 4)))
          assert hashlib.sha256(source).hexdigest() == 'b8e35c4b2372d432b85dcf12fcfb64f866aefd3096b9424ce32dc499caab345f'
          Path('/tmp/reconciliation-result/generate.py').write_bytes(source)
          PY
          cp reconciliation_web_followup.py /tmp/reconciliation-result/followup.py
      - name: Build exact candidate without changing main or the original PR
        run: |
          set -euo pipefail
          git fetch origin 13d2cf9000da998307553a1451bb929a54ad7376
          git worktree add -b codex/fix-web-async-ownership-20261109 /tmp/web-candidate 13d2cf9000da998307553a1451bb929a54ad7376
          cd /tmp/web-candidate
          python /tmp/reconciliation-result/generate.py
          python /tmp/reconciliation-result/followup.py
          git add -A
          test "$(git write-tree)" = ec7fc02f573eb1561035f6160479b8c7dee463bc
          git diff --cached --check
          python -m compileall -q e2e scripts
          node --experimental-strip-types --test scripts/web_ownership.test.mjs | tee /tmp/reconciliation-result/owner-tests.log
          git -c user.name=ChatGPT -c user.email=noreply@openai.com commit -m 'fix(web): fence async workbench requests by identity scope and view generation'
          git push origin HEAD:refs/heads/codex/fix-web-async-ownership-20261109
          git rev-parse HEAD > /tmp/reconciliation-result/head.txt
          git show --stat --oneline HEAD > /tmp/reconciliation-result/changes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reconciliation-candidate
          path: /tmp/reconciliation-result/
          retention-days: 3
          if-no-files-found: error
