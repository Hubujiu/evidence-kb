name: Reconciliation workspace

on:
  push:
    branches: [codex/pr-reconciliation-workbench-20261109]
    paths: [.github/workflows/reconciliation-workspace.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - name: Prepare exact frontend follow-up
        run: |
          set -euo pipefail
          mkdir -p /tmp/reconciliation-round2
          cp reconciliation_round2.py /tmp/reconciliation-round2/patch.py
          git fetch origin c289a1f3ad7f6f4c97c8656ae79c8d64eeb7ebc0
          git worktree add -b codex/web-registry-followup-20261109 /tmp/web-followup c289a1f3ad7f6f4c97c8656ae79c8d64eeb7ebc0
          cd /tmp/web-followup
          python /tmp/reconciliation-round2/patch.py
          git diff --check
          python -m compileall -q e2e kb_platform/rag_testing/web_runner_contracts.py
          node --experimental-strip-types --test scripts/web_ownership.test.mjs | tee /tmp/reconciliation-round2/owner-tests.log
          git add web/package-lock.json kb_platform/rag_testing/web_runner_contracts.py
          git -c user.name=ChatGPT -c user.email=noreply@openai.com commit -m 'fix(ci): use official npm tarballs without changing locked versions or integrity'
          git push origin HEAD:refs/heads/codex/web-registry-followup-20261109
          git rev-parse HEAD > /tmp/reconciliation-round2/web-head.txt
      - name: Prepare independent pinned action updates on latest main
        run: |
          set -euo pipefail
          git fetch origin main b39a0a40c6af7d0dde7d69e9023e5a3008d1f3b8 d0cd0ad3112643cddde59dcd8e7a03ea8f9db7c6
          test "$(git rev-parse origin/main)" = 69bc7d4d9868289a649b70c8946bd292f8951eb1
          git worktree add -b codex/ci-toolchain-reconciliation-20261109 /tmp/ci-candidate 69bc7d4d9868289a649b70c8946bd292f8951eb1
          cd /tmp/ci-candidate
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git merge --no-ff --no-commit b39a0a40c6af7d0dde7d69e9023e5a3008d1f3b8
          git commit -m 'build(ci): retain verified setup-java 6.1.0 update from PR79'
          git merge --no-ff --no-commit d0cd0ad3112643cddde59dcd8e7a03ea8f9db7c6
          git commit -m 'build(ci): retain setup-node 7.1.0 update from PR80'
          test "$(git diff --name-only 69bc7d4d9868289a649b70c8946bd292f8951eb1 HEAD)" = .github/workflows/ci.yml
          git diff --check 69bc7d4d9868289a649b70c8946bd292f8951eb1 HEAD
          git diff 69bc7d4d9868289a649b70c8946bd292f8951eb1 HEAD > /tmp/reconciliation-round2/ci-actions.diff
          git rev-parse HEAD > /tmp/reconciliation-round2/ci-head.txt
          git push origin HEAD:refs/heads/codex/ci-toolchain-reconciliation-20261109
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reconciliation-round2
          path: /tmp/reconciliation-round2/
          retention-days: 3
          if-no-files-found: error
