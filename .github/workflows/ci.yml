name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact=100

  quality:
    name: quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      KB_DEFER_DEFAULT_APP: '1'
      KB_REMOTE_MODELS: '0'
      KB_ENABLE_EMBEDDINGS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Run offline quality gates
        run: uv run --no-sync python scripts/check_project.py --output reports/ci/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/ci/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: integration (Rust host, PostgreSQL, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      KB_DEFER_DEFAULT_APP: '1'
      KB_REMOTE_MODELS: '0'
      KB_ENABLE_EMBEDDINGS: '0'
      E2E_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      KB_INTEGRATION_DSN: postgresql://kb_app:kb_local_app@127.0.0.1:55432/rust_plugin_acceptance_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - name: Install locked dependencies
        run: |
          uv sync --locked --group dev
          cd e2e
          npm ci --ignore-scripts
          node node_modules/@e2e-dev/web/dist/bin.js install chromium --with-deps
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Start isolated PostgreSQL and apply migrations
        run: |
          docker compose up -d --build --wait postgres
          database="rust_plugin_acceptance_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          docker compose exec -T postgres createdb -U kb_admin "$database"
          for migration in sql/*.sql; do
            docker compose exec -T postgres psql -U kb_admin -d "$database" -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Run project and database integration gates
        run: uv run --no-sync python scripts/check_project.py --local-integration --output reports/ci/integration-check
      - name: Run browser acceptance through Rust host
        run: uv run --no-sync python -m kb_platform.rag_testing.browser_integration --checker-summary reports/ci/integration-check/summary.json --output reports/ci/browser
      - name: Capture database logs
        if: always()
        run: |
          mkdir -p reports/ci/database
          docker compose logs --no-color postgres > reports/ci/database/postgres.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-evidence
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated services
        if: always()
        run: docker compose stop

  required:
    name: required
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, secrets, integration]
    timeout-minutes: 2
    steps:
      - name: Require every quality job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$QUALITY_RESULT" = success && test "$SECRETS_RESULT" = success && test "$INTEGRATION_RESULT" = success
