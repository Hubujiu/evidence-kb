name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact=100

  quality:
    name: quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      KB_DEFER_DEFAULT_APP: '1'
      KB_REMOTE_MODELS: '0'
      KB_ENABLE_EMBEDDINGS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - name: Install locked source lint dependencies
        run: npm ci --ignore-scripts --prefix e2e
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Use isolated runner temporary storage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $storageCheckParent = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $storageCheckTemp = [System.IO.Path]::GetFullPath((Join-Path $storageCheckParent "evidence-kb-checks-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-py${{ matrix.python }}"))
          if (Test-Path -LiteralPath $storageCheckTemp) { throw 'Temporary check directory already exists' }
          New-Item -ItemType Directory -Path $storageCheckTemp | Out-Null
          "TMP=$storageCheckTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$storageCheckTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMPDIR=$storageCheckTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Observe durable SQLite commits on Windows disks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import json, os, sqlite3, time
          from pathlib import Path
          from uuid import uuid4
          observations = []
          for round_id in range(5):
              targets = (("runner", os.environ["TEMP"]), ("system", os.environ["SystemDrive"] + "/"))
              for label, root in targets[::1 if round_id % 2 == 0 else -1]:
                  path = Path(root) / ("durable-probe-" + uuid4().hex + ".sqlite3")
                  connection = sqlite3.connect(path)
                  try:
                      connection.execute("PRAGMA synchronous=FULL")
                      journal = connection.execute("PRAGMA journal_mode=DELETE").fetchone()[0]
                      connection.execute("CREATE TABLE probe(id INTEGER PRIMARY KEY, value TEXT)")
                      start = time.monotonic()
                      for index in range(64):
                          connection.execute("INSERT INTO probe VALUES(?,?)", (index, "synthetic"))
                          connection.commit()
                      elapsed = time.monotonic() - start
                      synchronous = connection.execute("PRAGMA synchronous").fetchone()[0]
                      connection.close()
                      connection = sqlite3.connect(path)
                      count = connection.execute("SELECT COUNT(*) FROM probe").fetchone()[0]
                      if count != 64 or synchronous != 2 or journal != "delete":
                          raise RuntimeError("Durable SQLite disk probe mismatch")
                      observations.append({"location": label, "root": root, "round": round_id,
                          "commits": 64, "reopened_rows": count, "synchronous": synchronous,
                          "journal_mode": journal, "seconds": elapsed})
                  finally:
                      connection.close()
                      path.unlink()
          output = Path("reports/ci/windows-temp-probe.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(observations, indent=2), encoding="utf-8")
          print(json.dumps(observations))
          '@ | uv run --no-sync python -
      - name: Run offline quality gates
        run: uv run --no-sync python scripts/check_project.py --output reports/ci/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/ci/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove owned Windows temporary storage
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $storageCheckParent = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $storageCheckTemp = [System.IO.Path]::GetFullPath((Join-Path $storageCheckParent "evidence-kb-checks-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-py${{ matrix.python }}"))
          if ([System.IO.Path]::GetDirectoryName($storageCheckTemp) -ne $storageCheckParent -or [System.IO.Path]::GetFileName($storageCheckTemp) -ne "evidence-kb-checks-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-py${{ matrix.python }}") { throw 'Unexpected temporary cleanup path' }
          if (Test-Path -LiteralPath $storageCheckTemp) { Remove-Item -LiteralPath $storageCheckTemp -Recurse -Force }

  integration:
    name: integration (Rust host, PostgreSQL, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      KB_DEFER_DEFAULT_APP: '1'
      KB_REMOTE_MODELS: '0'
      KB_ENABLE_EMBEDDINGS: '0'
      E2E_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      KB_INTEGRATION_DSN: postgresql://kb_app:kb_local_app@127.0.0.1:55432/rust_plugin_acceptance_ci_${{ github.run_id }}_${{ github.run_attempt }}
      KB_INTEGRATION_MIGRATION_DSN: postgresql://kb_admin:kb_local_admin@127.0.0.1:55432/rust_plugin_acceptance_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - name: Install locked dependencies
        run: |
          uv sync --locked --group dev
          cd e2e
          npm ci --ignore-scripts
          node node_modules/@e2e-dev/web/dist/bin.js install chromium --with-deps
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Start isolated PostgreSQL and install provider extensions
        run: |
          docker compose up -d --build --wait postgres
          database="rust_plugin_acceptance_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          docker compose exec -T postgres createdb -U kb_admin "$database"
          docker compose exec -T postgres psql -U kb_admin -d "$database" -v ON_ERROR_STOP=1 < docker/postgres/bootstrap.sql
      - name: Prepare actual storage fixtures
        run: |
          docker pull mysql:8.4
          docker pull redis:8.2.10
          docker build -t evidence-kb-minio-storage-test:RELEASE.2025-10-15T17-29-55Z docker/minio
          uv run --no-sync python -m kb_platform.rag_testing.storage_resources prepare --output .local/ci-storage-resources
          uv run --no-sync python -c 'import json, os; from pathlib import Path; state=json.loads(Path(".local/ci-storage-resources/resources-private.json").read_text("utf-8")); selected={k:v for k,v in state["environment"].items() if k.startswith("KB_STORAGE_TEST_")}; [print("::add-mask::"+v) for v in selected.values()]; Path(os.environ["GITHUB_ENV"]).open("a").write("".join(k+"="+v+"\n" for k,v in selected.items()))'
      - name: Run project and database integration gates
        run: uv run --no-sync python scripts/check_project.py --local-integration --storage-integration --browser-integration --output reports/ci/integration-check
      - name: Capture database logs
        if: always()
        run: |
          mkdir -p reports/ci/database
          docker compose logs --no-color postgres > reports/ci/database/postgres.log
      - name: Stop isolated services
        if: always()
        run: |
          if test -f .local/ci-storage-resources/resources-private.json; then
            uv run --no-sync python -m kb_platform.rag_testing.storage_resources cleanup --output .local/ci-storage-resources
          fi
          mkdir -p reports/ci/storage-resources
          for record in resources.json cleanup.json; do
            if test -f .local/ci-storage-resources/$record; then
              cp .local/ci-storage-resources/$record reports/ci/storage-resources/$record
            fi
          done
          docker compose stop
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-evidence
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14

  formal:
    name: formal (bounded TLC and source mapping)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      KB_DEFER_DEFAULT_APP: '1'
      KB_REMOTE_MODELS: '0'
      KB_ENABLE_EMBEDDINGS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Python dependencies
        run: uv sync --locked --group dev
      - name: Install hash-verified official TLC release
        run: uv run --no-sync python scripts/install_formal_tools.py
      - name: Check bounded models and negative controls
        run: uv run --no-sync python scripts/check_project.py --formal-only --output reports/ci/formal
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-evidence
          path: reports/ci/formal/
          if-no-files-found: error
          retention-days: 14

  required:
    name: required
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, secrets, integration, formal]
    timeout-minutes: 2
    steps:
      - name: Require every quality job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: test "$QUALITY_RESULT" = success && test "$SECRETS_RESULT" = success && test "$INTEGRATION_RESULT" = success && test "$FORMAL_RESULT" = success
